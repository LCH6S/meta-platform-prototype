<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>Meta 平台 · 品牌通用小票打印设置</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#f2f2f4; color:#202329; font:14px/1.5 system-ui,sans-serif; }
    .meta-header { display:flex; align-items:center; gap:24px; min-height:48px; padding:0 20px; background:#191a23; color:#fff; }
    .meta-brand { display:block; width:88px; height:auto; }
    .meta-nav { display:flex; gap:clamp(12px,2.8vw,38px); align-items:center; margin-inline-start:clamp(0px,4vw,76px); overflow:auto; white-space:nowrap; }
    .meta-nav span { position:relative; padding:12px 0; }
    .meta-nav [aria-current] { font-weight:600; }
    .meta-nav [aria-current]::after { content:""; position:absolute; bottom:6px; left:calc(50% - 7px); width:14px; height:2px; border-radius:1px; background:#fff; }
    .meta-account { margin-left:auto; flex:none; font-weight:600; }
    .meta-account small { display:block; font-weight:400; }
    .meta-layout { display:grid; grid-template-columns:184px minmax(0,1fr); min-height:calc(100vh - 48px); }
    .meta-sidebar { padding:12px 7px; background:#fff; }
    .meta-sidebar h2 { display:flex; justify-content:space-between; margin:4px 0; padding:11px 13px; font-size:14px; }
    .meta-sidebar p { margin:4px 0; padding:10px 13px; }
    .meta-sidebar .meta-subitem { padding-left:16px; }
    .meta-sidebar [aria-current] { border-left:3px solid #202329; border-radius:2px; background:#eeeef0; font-weight:600; }
    .meta-main { min-width:0; padding:17px; }
    .meta-panel { min-height:calc(100vh - 82px); padding:16px 17px 32px; background:#fff; }
    .meta-heading { display:flex; gap:12px; align-items:center; margin:12px 0 16px; }
    .meta-heading h1 { margin:0; font-size:14px; }
    .meta-device-scope { color:#294d9c; font-size:12px; }
    .meta-tabs { display:flex; gap:28px; border-bottom:1px solid #e2e4e8; }
    .meta-tabs span { padding:10px 0; }
    .meta-tabs [aria-current] { margin-bottom:-1px; border-bottom:2px solid #202329; font-weight:600; }
    #crmMetaPosSettings .app-setting-header h3 { padding-left:9px; border-left:3px solid #202329; line-height:20px; }
    #crmMetaPosSettings .crm-settings-content { max-width:420px; }
    #crmMetaPosSettings .pos-setting-fields { border:0; box-shadow:none; padding:8px 0 0 10px; }
    #crmMetaPosSettings .pos-setting-field { min-height:42px; }
    #crmMetaPosSettings .pos-setting-field:has(.pos-select-current):not(:has(.pos-select-editor:not([hidden]))) { grid-template-columns:minmax(0,1fr) minmax(136px,190px); }
    #crmMetaPosSettings .pos-select-current { justify-content:flex-end; }
    #crmMetaPosSettings .pos-setting-field:has(> .pos-switch) { grid-template-columns:minmax(0,1fr) auto; }
    #crmMetaPosSettings .pos-switch[aria-checked="true"] { background:#262626; }
    #crmMetaPosSettings .crm-inline-link { color:#294d9c; }
    @media (max-width:640px) {
      .meta-layout { grid-template-columns:1fr; }
      .meta-sidebar,.meta-account { display:none; }
      .meta-main { padding:12px; }
      .meta-panel { padding:16px; }
    }
    @media (max-width:430px) {
      #crmMetaPosSettings .pos-setting-field:has(.pos-select-current):not(:has(.pos-select-editor:not([hidden]))) { grid-template-columns:1fr; }
      #crmMetaPosSettings .pos-select-current { justify-content:flex-start; }
    }
  </style>

    :scope {
      --top: var(--meta-color-header);
      --brand: var(--meta-color-brand);
      --bg: var(--meta-color-layout);
      --panel: #ffffff;
      --nav: var(--meta-color-container);
      --line: var(--meta-color-split);
      --line-dark: #2e2f35;
      --text: var(--meta-color-text-primary);
      --muted: var(--meta-color-text-secondary);
      --subtle: var(--meta-color-text-disabled);
      --blue: var(--meta-color-link);
      --blue-soft: #eef3ff;
      --green: var(--meta-color-success);
      --green-soft: #eaf8f1;
      --red: var(--meta-color-error);
      --red-soft: #fff0ef;
      --yellow-soft: #fff8e1;
      --shadow: 0 18px 42px rgba(24, 25, 33, .16);
    }

    * {
      box-sizing: border-box;
    }

    :scope {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {

    }

    .detail-summary-item dt,
    .detail-field dt {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .detail-summary-item dd,
    .detail-field dd {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .detail-block {
      padding: 0 18px;
      margin: 0 0 34px;
    }

    .detail-info-layout {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px 72px;
      max-width: none;
    }

    .detail-field {
      min-width: 0;
    }

    .detail-table-wrap {
      overflow-x: auto;
      margin-left: 0;
    }

    .detail-block-note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .suggest-wrap {
      position: relative;
    }

    .suggest-list {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      background: #fff;
      border: 1px solid #d8d9dd;
      box-shadow: 0 12px 26px rgba(24, 25, 33, .12);
      max-height: 190px;
      overflow-y: auto;
    }

    .suggest-item {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-bottom: 1px solid #eeeeef;
      background: #fff;
      padding: 7px 10px;
      text-align: left;
      display: block;
    }

    .suggest-item:hover {
      background: #f6f7fa;
    }

    .suggest-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .suggest-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .placeholder-panel {
      min-height: 260px;
      border: 1px dashed #d9dce1;
      background: #fafafa;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    .muted-value {
      color: var(--muted);
    }

    .material-page {
      padding: 0;
    }

    .material-banner {
      min-height: 42px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 16px;
      padding: 11px 14px;
      color: #8a5b00;
      background: #fff8e1;
      border: 1px solid #f1df9a;
      border-radius: 3px;
      font-size: 13px;
      line-height: 1.55;
    }

    .material-banner-icon {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: #f59f00;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      margin-top: 1px;
    }

    .material-config-card {
      border: 1px solid var(--line);
      background: #fff;
    }

    .material-config-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .material-config-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .material-config-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 24px;
      align-items: center;
      min-height: 166px;
      padding: 20px;
      border-bottom: 1px solid #f0f1f3;
    }

    .material-config-row:last-child {
      border-bottom: 0;
    }

    .material-config-main {
      min-width: 0;
    }

    .material-title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .material-title-line h2 {
      margin: 0;
      color: #202124;
      font-size: 14px;
      font-weight: 600;
      line-height: 22px;
    }

    .material-status { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; line-height: 22px; font-weight: 400; white-space: nowrap; }
    .material-status::before { content: ""; width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: var(--meta-color-text-tertiary); }
    .material-status.configured::before { background: var(--meta-color-success); }
    .material-status.pending::before { background: var(--meta-color-warning); }

    .material-row-desc,
    .material-help,
    .material-file-line {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .material-help {
      margin-top: 8px;
    }

    .material-file-line {
      margin-top: 5px;
    }

    .material-file-line span {
      color: #202124;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .material-upload-area {
      display: grid;
      justify-items: end;
      gap: 10px;
    }

    .material-upload-tile {
      width: 136px;
      height: 104px;
      border: 1px solid #c6c9cf;
      border-radius: 3px;
      background: #fafafa;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease;
    }

    .material-upload-tile.peripheral {
      width: 92px;
      height: 136px;
    }

    .material-upload-tile:hover {
      border-color: var(--blue);
      background: #fff;
    }

    .material-upload-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .material-upload-tile.configured img {
      display: block;
    }

    .material-upload-empty {
      display: grid;
      gap: 8px;
      justify-items: center;
      color: #565a61;
      font-size: 13px;
      font-weight: 700;
    }

    .material-upload-icon {
      width: 28px;
      height: 28px;
      border: 1px dashed #9a9da3;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #6c7077;
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
    }

    .material-upload-tile.configured .material-upload-empty {
      display: none;
    }

    .material-file-input {
      display: none;
    }

    .material-inline-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      min-height: 30px;
    }

    .material-inline-actions .btn { min-width: auto; }

    .device-preview-wrap {
      display: grid;
      place-items: center;
      padding: 6px 0 2px;
    }

    .pos-frame {
      width: 252px;
      height: 560px;
      border-radius: 26px;
      background: #11141b;
      padding: 13px 10px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .22);
      position: relative;
    }

    .pos-frame::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 7px;
      width: 44px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #2d313a;
    }

    .pos-screen {
      height: 100%;
      overflow: hidden;
      border-radius: 17px;
      background: #f6f7f9;
      position: relative;
    }

    .pos-status {
      height: 23px;
      background: #050505;
      color: #fff;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px;
      font-weight: 700;
    }

    .pos-standard-hero {
      height: 210px;
      position: relative;
      overflow: hidden;
    }

    .pos-peripheral-hero {
      position: absolute;
      inset: 23px 0 0;
      overflow: hidden;
    }

    .pos-art {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }

    .pos-standard-hero .pos-art {
      background-color: #eef0f3;
    }

    .pos-peripheral-hero .pos-art {
      background-color: #eef0f3;
    }

    .pos-art.empty::after {
      content: attr(data-empty);
      position: absolute;
      left: 18px;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .pos-art-label {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
      text-shadow: 0 2px 6px rgba(0, 0, 0, .34);
    }

    .pos-home-body {
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .pos-home-tile {
      height: 72px;
      border-radius: 7px;
      background: #fff;
      border: 1px solid #edf0f4;
      display: grid;
      place-items: center;
      color: #282b31;
      font-size: 13px;
      font-weight: 700;
    }

    .pos-wait-copy {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 36px;
      color: #fff;
    }

    .pos-wait-title {
      margin: 0 0 7px;
      font-size: 19px;
      font-weight: 800;
      line-height: 1.3;
    }

    .pos-wait-sub {
      margin: 0;
      font-size: 12px;
      line-height: 1.55;
      opacity: .86;
    }

    .setting-inline-action {
      border: 0;
      background: transparent;
      color: var(--blue);
      padding: 0;
      font-size: 13px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 38px;
      margin-bottom: 24px;
    }

    .info-card {
      border: 1px solid var(--line);
      padding: 16px;
      min-height: 138px;
    }

    .option-group {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option {
      border: 1px solid #d8d9dd;
      border-radius: 4px;
      padding: 14px 14px 14px 42px;
      position: relative;
      background: #fff;
      min-height: 58px;
    }

    .option input {
      position: absolute;
      left: 14px;
      top: 17px;
    }

    .option.active {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .option-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .option-desc {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .form-row {
      margin-bottom: 16px;
    }

    .form-row label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 7px;
      font-weight: 600;
    }

    .workstation-list {
      display: grid;
      gap: 10px;
    }

    .workstation-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px;
      gap: 8px;
      align-items: center;
    }

    .workstation-row .control {
      width: 100%;
    }

    .workstation-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .form-tip {
      color: var(--muted);
      font-size: 12px;
    }

    .btn.small {
      height: 30px;
      padding: 0 12px;
      font-size: 13px;
    }

    .btn.link-danger {
      height: 30px;
      padding: 0;
      color: var(--red);
      background: transparent;
      border: 0;
    }

    .btn.link-danger:disabled {
      color: var(--subtle);
      cursor: not-allowed;
    }

    .notice {
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      margin-top: 14px;
      color: #6b4d12;
      background: var(--yellow-soft);
      border: 1px solid #f2dd9a;
      border-radius: 3px;
      font-size: 12px;
      line-height: 1.45;
    }

    .confirm-message {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .confirm-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--red);
      background: var(--red-soft);
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    .confirm-title {
      margin: 2px 0 8px;
      color: #202124;
      font-size: 16px;
      font-weight: 800;
    }

    .confirm-desc {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .dialog {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 620px;
      max-width: calc(100vw - 96px);
      max-height: calc(100vh - 96px);
      background: #fff;
      box-shadow: var(--shadow);
      transform: translate(-50%, -48%) scale(.98);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 22;
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr) 62px;
    }

    :scope.dialog-open .dialog {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .dialog-body {
      overflow-y: auto;
      padding: 24px 28px 28px;
    }

    .success-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 28px;
      align-items: center;
    }

    .success-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 12px;
    }

    .success-desc {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 20px;
    }

    .qr {
      width: 190px;
      height: 190px;
      padding: 13px;
      border: 1px solid var(--line);
      background: #fff;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 4px;
    }

    .qr span {
      background: #111;
    }

    .qr-label {
      margin-top: 12px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }

    .change-table {
      min-width: 900px;
    }

    .change-table th {
      height: 42px;
      background: #f7f8fa;
      border-bottom: 1px solid var(--line);
      color: #5f636b;
    }

    .change-table td {
      height: 86px;
      vertical-align: top;
      white-space: normal;
      line-height: 1.5;
      padding-top: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .page-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 70px;
      transform: translateX(-50%) translateY(-12px);
      min-width: 220px;
      height: 42px;
      background: rgba(24, 25, 33, .92);
      color: #fff;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 40;
      font-size: 14px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .app {
        min-width: 760px;
      }


      .basic-grid,
      .info-grid,
      .success-layout,
      .detail-summary-grid,
      .detail-info-layout {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }
    }
  
/* CRM style follows the referenced brand-detail Demo, not the Meta admin shell. */
:scope { --meta-color-primary:#1c6cef; --meta-color-primary-hover:#4096ff; --meta-color-primary-active:#0958d9; --meta-color-link:#1c6cef; --meta-color-link-hover:#4096ff; --meta-color-link-active:#0958d9; --meta-color-success:#52c41a; --meta-color-warning:#faad14; --meta-color-error:#ff4d4f; --meta-color-border:#d9d9d9; --meta-color-text-primary:#262626; --meta-color-text-secondary:#8c8c8c; --meta-color-layout:#f5f6f8; }
:scope { min-width:0; background:#fff; font-size:14px; }
.app { min-width:0; min-height:0; }
.app > .topbar,.shell > .sidebar,.main > .breadcrumb { display:none!important; }
.shell { display:block; min-height:0; }
.main { padding:0; }
#settingsPage { padding:0 0 20px; min-height:0; margin:0; }
.crm-settings-layout { display:grid; grid-template-columns:148px minmax(0,1fr); align-items:start; gap:20px; }
.crm-settings-nav { position:sticky; top:0; padding-right:12px; border-right:1px solid #edf0f2; }
.crm-settings-nav [role="tablist"] { display:grid; gap:4px; }
.crm-settings-nav [role="tab"] { min-height:36px; padding:7px 12px; border:0; border-radius:4px; color:#595959; background:transparent; text-align:left; }
.crm-settings-nav [role="tab"]:hover { background:#f5f6f8; }
.crm-settings-nav [role="tab"][aria-selected="true"] { background:#eef4ff; color:var(--meta-color-primary); font-weight:600; }
.crm-settings-nav [role="tab"]:focus-visible { outline:2px solid var(--meta-color-primary); outline-offset:-2px; }
.crm-settings-content { min-width:0; max-width:780px; container:crm-pos-content / inline-size; }
.crm-settings-list { display:grid; gap:24px; }
.crm-setting-section { display:grid; gap:8px; }
.crm-setting-section [hidden] { display:none!important; }
.app-setting-header { display:block; min-width:0; padding:0; margin:0; border:0; min-height:0; }
.app-setting-header h3 { margin:0; color:#262626; font-size:16px; font-weight:600; line-height:24px; }
.crm-setting-intro { margin:3px 0 0; color:#595959; line-height:20px; }
.crm-inline-link { padding:0; border:0; background:none; color:var(--meta-color-link); }
.pos-switch { position:relative; justify-self:end; width:36px; height:20px; padding:0; border:0; border-radius:12px; background:#8b909a; }
.pos-switch[aria-checked="true"] { background:var(--meta-color-primary); }
.pos-switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px #0003; }
.pos-switch[aria-checked="true"]::after { left:18px; }
.pos-switch:focus-visible { outline:2px solid var(--meta-color-primary); outline-offset:3px; }
.pos-switch-confirm { position:fixed; inset:auto; width:max-content; max-width:calc(100vw - 16px); margin:0; padding:12px; border:1px solid #e5e7eb; border-radius:6px; background:#fff; color:var(--text); box-shadow:0 6px 20px #17253c26; overflow:visible; }
.pos-switch-confirm::before { content:""; position:absolute; top:-5px; left:var(--pos-switch-arrow, 80%); width:8px; height:8px; border-left:1px solid #e5e7eb; border-top:1px solid #e5e7eb; background:#fff; transform:rotate(45deg); }
.pos-switch-confirm[data-above]::before { top:auto; bottom:-5px; transform:rotate(225deg); }
.pos-switch-confirm[data-beside]::before { top:var(--pos-switch-arrow); bottom:auto; left:-5px; transform:rotate(-45deg); }
.pos-switch-confirm p { margin:0 0 10px; }
.pos-switch-confirm-actions { display:flex; justify-content:flex-end; gap:8px; }
.pos-switch-confirm-actions .btn { height:26px; min-width:46px; padding:0 8px; }
.btn.primary:disabled { color:#bfbfbf; background:#f5f5f5; border-color:#d9d9d9; opacity:1; }
.dialog { max-width:calc(100vw - 40px); border-radius:4px; }
.crm-settings-popup::backdrop { background:#14203455; }
.crm-settings-popup { position:fixed; inset:0; width:100%; height:100%; max-width:none; max-height:none; margin:0; padding:0; border:0; background:transparent; overflow:visible; }
:scope:has(.crm-settings-popup[open]) .mask { opacity:0; pointer-events:none; }
.pos-setting-fields { padding:8px 16px; border:1px solid #e5e8ed; border-radius:8px; background:#fff; box-shadow:0 2px 6px #1821390d; }
.pos-setting-field { display:grid; grid-template-columns:minmax(0,1fr) minmax(128px,180px); gap:12px; align-items:center; min-height:48px; margin-inline:-8px; padding:9px 8px; border-radius:4px; cursor:pointer; }
.pos-setting-field > .pos-picture-thumb { justify-self:end; }
.pos-setting-field .control { width:100%; min-width:0; height:28px; border:1px solid #d9d9d9; border-radius:4px; padding:0 8px; }
.pos-setting-field .control:focus { border-color:var(--meta-color-primary); box-shadow:0 0 0 2px #e3eeff; }
.pos-setting-field:has(.pos-select-editor) { grid-template-columns:minmax(0,1fr) minmax(230px,300px); }
.pos-select-editor,.pos-select-current { display:flex; align-items:center; justify-content:flex-end; gap:8px; min-width:0; }
.pos-select-editor .control { width:180px; }
.pos-select-editor .btn { height:28px; padding:0 8px; white-space:nowrap; }
.pos-select-current [data-setting-value] { min-width:0; overflow-wrap:anywhere; text-align:right; }
.pos-setting-field[data-receipt-logo] { grid-template-columns:minmax(0,1fr) minmax(170px,300px); }
@container crm-pos-content (max-width:480px) {
  .pos-setting-field:has(> .pos-switch) { grid-template-columns:minmax(0,1fr) auto; }
  .pos-setting-field:has(> :is(.pos-select-current,.pos-select-editor)) { grid-template-columns:minmax(0,1fr); gap:6px; }
  .pos-select-current,.pos-select-editor { justify-content:flex-start; }
  .pos-select-current [data-setting-value] { text-align:left; }
}
.pos-logo-dialog-content [hidden] { display:none!important; }
.pos-image-dialog-with-preview { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:24px; align-items:start; }
.pos-image-preview-panel { min-width:0; padding:12px 14px 16px; border:1px solid #e5e8ed; border-radius:6px; background:#f7f8fa; }
.pos-image-preview-heading { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 8px; margin-bottom:8px; }
.pos-image-preview-heading h4 { margin:0; font-size:14px; font-weight:600; }
.pos-image-preview-heading .pos-setting-description { margin:0; }
.pos-image-preview-panel .device-preview-wrap { padding-bottom:8px; }
.pos-image-preview-panel .pos-frame { zoom:.72; }
.pos-receipt-preview-paper { position:relative; width:min(220px, 100%); margin-inline:auto; background:#fff; box-shadow:0 2px 8px #17253c1f; }
.pos-receipt-preview-sample { display:block; width:100%; height:auto; }
.pos-receipt-preview-logo { position:absolute; inset:0 0 auto; height:12.5%; padding:3% 22%; background:#fff; }
.pos-receipt-preview-logo img { display:block; width:100%; height:100%; object-fit:contain; filter:grayscale(1); }
.dialog:has(.pos-image-thumb:not([hidden])) { min-height:min(360px, calc(100vh - 96px)); }
#dialogFoot [data-logo-dialog-action][hidden] { display:none!important; }
.pos-logo-overview { display:flex; align-items:center; gap:12px; min-width:0; min-height:56px; margin-top:14px; }
.pos-logo-actions { margin-top:12px; }
.pos-image-thumb { display:flex; align-items:center; justify-content:center; flex:none; width:160px; height:144px; padding:8px; overflow:hidden; border:1px solid #e5e8ed; border-radius:4px; background:#f7f8fa; }
.pos-image-thumb img { display:block; width:100%; height:100%; min-width:0; min-height:0; object-fit:contain; }
.pos-image-dialog-with-preview .pos-image-thumb { width:min(216px, 100%); height:206px; }
.pos-select-current > button { flex:none; white-space:nowrap; }
.pos-select-current [data-setting-value] button { max-width:100%; overflow-wrap:anywhere; text-align:inherit; }
.pos-setting-description { color:#595959; margin:2px 0 0; font-size:13px; line-height:18px; }
.pos-setting-error { color:var(--meta-color-error); margin:8px 0 0; }
.pos-app-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px 12px; }
.pos-app-card { min-width:0; padding:12px; border:1px solid #e5e8ed; border-radius:8px; background:#fff; box-shadow:0 2px 6px #1821390d; cursor:pointer; }
.pos-app-card-top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px; }
.pos-app-card .pos-switch { flex:none; }
.pos-app-card h4 { margin:0; font-size:14px; font-weight:600; line-height:22px; }
.pos-app-card p { overflow-wrap:anywhere; }
.pos-picture { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px 12px; min-width:0; }
.pos-picture-add,.pos-picture-thumb { display:grid; place-items:center; flex:none; width:84px; height:64px; padding:0; border-radius:4px; }
.pos-picture-add { border:1px dashed #c9ced7; color:#595959; background:#f7f8fa; font-size:12px; }
.pos-picture-add:hover,.pos-picture-thumb:hover { border-color:var(--meta-color-primary); color:var(--meta-color-primary); }
.pos-picture-thumb { overflow:hidden; border:1px solid #e5e7eb; background:#f7f8fa; }
.pos-picture-thumb img { display:block; width:100%; height:100%; object-fit:contain; }
.pos-picture-entry { display:flex; align-items:center; gap:10px; min-width:0; }
.pos-picture-info { min-width:0; overflow-wrap:anywhere; }
.pos-picture-actions { display:flex; gap:10px; margin-top:4px; }
.pos-picture-delete { color:#d43838; }
.pos-image-preview { display:block; max-width:100%; max-height:60vh; margin:auto; object-fit:contain; }
.pos-picture [data-material-error] { flex-basis:100%; }
@media(hover:hover) {
  .pos-setting-field:hover { background:#f4f7fb; }
  .pos-app-card:hover { border-color:#b8d3ff; background:#f7faff; }
}
@media(max-width:760px) {
  .pos-app-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media(max-width:640px) {
  .crm-settings-layout { grid-template-columns:1fr; gap:12px; }
  .crm-settings-nav { position:static; padding:0; border:0; }
  .crm-settings-nav [role="tablist"] { display:flex; flex-wrap:wrap; }
}
@media(max-width:480px) {
  .pos-image-dialog-with-preview { grid-template-columns:1fr; gap:16px; }
  .pos-logo-overview { flex-wrap:wrap; }
  .pos-image-thumb { width:128px; height:120px; }
}
@media(max-width:360px) {
  .pos-app-grid { grid-template-columns:1fr; }
  .pos-setting-field { grid-template-columns:1fr; gap:6px; }
  .pos-switch,.pos-setting-field > .pos-picture-thumb { justify-self:start; }
  .pos-picture { justify-content:flex-start; }
}

      function showToast(message) {
      const surface = root.querySelector(".crm-settings-popup[open]")
        || body;
      if (toast.parentElement !== surface) surface.append(toast);
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1600);
    }


    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[char]);
    }


    function hideFloatingTooltip() {
      if (!floatingTooltip) return;
      floatingTooltip.remove();
      floatingTooltip = null;
    }

    function confirmPictureRemoval(target, remove, message = "是否确认删除") {
      hideFloatingTooltip();
      floatingTooltip = document.createElement("div");
      floatingTooltip.className = "material-delete-popover";
      floatingTooltip.innerHTML = `
        <p class="material-delete-title"></p>
        <div class="material-delete-actions">
          <button class="btn" type="button" data-material-delete-cancel>否</button>
          <button class="btn danger" type="button" data-material-delete-confirm>是</button>
        </div>
      `;
      floatingTooltip.querySelector(".material-delete-title").textContent = message;
      const container = target.closest('dialog[open]') || body;
      container.appendChild(floatingTooltip);

      const rect = target.getBoundingClientRect();
      const tooltipRect = floatingTooltip.getBoundingClientRect();
      let left = rect.right - tooltipRect.width;
      left = Math.min(Math.max(left, 8), window.innerWidth - tooltipRect.width - 8);
      let top = rect.bottom + 10;
      if (top + tooltipRect.height > window.innerHeight - 8) top = rect.top - tooltipRect.height - 10;
      if (top < 8) top = 8;
      floatingTooltip.style.left = `${left}px`;
      floatingTooltip.style.top = `${top}px`;

      floatingTooltip.addEventListener("click", (event) => event.stopPropagation());
      floatingTooltip.querySelector("[data-material-delete-cancel]").addEventListener("click", hideFloatingTooltip);
      floatingTooltip.querySelector("[data-material-delete-confirm]").addEventListener("click", () => {
        hideFloatingTooltip();
        remove();
      });
    }


    function openDialog(title) {
      dialogTitle.textContent = title;
      dialog.setAttribute("aria-hidden", "false");
      body.classList.add("dialog-open");
      const popup = dialog.closest("dialog");
      if (popup && !popup.open) popup.showModal();
    }

    function materialBackgroundAttr(imageUrl) {
      return imageUrl ? ` style="background-image: url('${escapeHtml(imageUrl)}')"` : "";
    }

    function materialPreviewBackgroundAttr(type, imageUrl) {
      if (imageUrl) return materialBackgroundAttr(imageUrl);
      const background = type === "peripheral"
        ? "linear-gradient(180deg, #111827 0%, #355c7d 48%, #f1c453 100%)"
        : "linear-gradient(135deg, #1d4f73 0%, #2a9d8f 58%, #f2c94c 100%)";
      return ` style="background-image: ${background}"`;
    }


    function posImageError(file) {
      if (!["image/png", "image/jpeg"].includes(file.type)) return "仅支持 PNG、JPG 格式。";
      if (file.size > 2 * 1024 * 1024) return "图片大小需在 2 MB 以内。";
      return "";
    }

    function isPosImageReadable(src) {
      const image = new Image();
      image.src = src;
      return image.decode().then(() => true, () => false);
    }

  function initializePosImageSetting(row, getSavedImage, saveImage, {

      modal.error.hidden = !message;
    }

    modal.upload.addEventListener('click', () => uploadInput.click());
    modal.remove.addEventListener('click', event => {
      event.stopPropagation();
      confirmPictureRemoval(event.currentTarget, () => {
        saveImage(null, showError, () => {
          reset();
          modal.upload.focus();
        });
      }, deleteMessage);
    });
    uploadInput.addEventListener('change', () => {
      const file = uploadInput.files[0];
      uploadInput.value = '';
      if (!file) return;
      modal.reader = null;
      modal.draft = null;
      const problem = posImageError(file);
      if (problem) {
        showError(problem);
        render();
        return;
      }
      const reader = new FileReader();
      modal.reader = reader;
      reader.addEventListener('load', async () => {
        const readable = await isPosImageReadable(reader.result);
        if (modal.reader !== reader || !modal.content.isConnected) return;
        modal.reader = null;
        if (readable) {
          modal.draft = { source: 'upload', label: file.name, src: reader.result };
        } else {
          showError('图片无法读取，请重新选择。');
        }
        render();
      });
      reader.addEventListener('error', () => {
        if (modal.reader !== reader || !modal.content.isConnected) return;
        modal.reader = null;
        showError('图片无法读取，请重新选择。');
        render();
      });
      showError('');
      render();
      reader.readAsDataURL(file);
    });
    modal.save.addEventListener('click', () => {
      if (!modal.draft || modal.reader) return;
      saveImage(modal.draft, showError, () => {
        reset();
        closeDialog();
      });
    });
    render();
    openDialog(title);
    modal.upload.focus();
  });
  return { render, reset };
}

const settingsPopup = document.createElement('dialog');
settingsPopup.className = 'crm-settings-popup';
settingsPopup.setAttribute('aria-labelledby', 'dialogTitle');
body.append(settingsPopup);
settingsPopup.append(dialog);
settingsPopup.addEventListener('cancel', event => {

const switchPopover = document.createElement('div');
switchPopover.className = 'pos-switch-confirm';
switchPopover.setAttribute('popover', 'auto');
switchPopover.setAttribute('role', 'dialog');
switchPopover.setAttribute('aria-labelledby', 'posSwitchConfirmTitle');
switchPopover.innerHTML = `
  <p id="posSwitchConfirmTitle"></p>
  <div class="pos-switch-confirm-actions">
    <button class="btn" type="button" data-switch-cancel>取消</button>
    <button class="btn primary" type="button" data-switch-confirm>确认</button>
  </div>`;
body.append(switchPopover);
let pendingSwitch;

function confirmPosSwitch(control, apply) {
  if (switchPopover.matches(':popover-open')) switchPopover.hidePopover();
  toast.classList.remove('show');
  const enabled = control.getAttribute('aria-checked') !== 'true';
  pendingSwitch = { control, apply, enabled };
  const label = enabled ? '开启' : '关闭';
  const name = control.dataset.confirmName;
  const spacing = /^[A-Za-z]/.test(name) ? ' ' : '';
  switchPopover.querySelector('p').textContent = `确认${label}${spacing}${name}？`;
  const anchor = control.getBoundingClientRect();
  switchPopover.showPopover();
  const { width, height } = switchPopover.getBoundingClientRect();
  const beside = anchor.right + width + 18 <= innerWidth;
  switchPopover.toggleAttribute('data-beside', beside);
  if (beside) {
    const top = Math.max(8, Math.min(anchor.top + (anchor.height - height) / 2, innerHeight - height - 8));
    switchPopover.style.left = `${anchor.right + 8}px`;
    switchPopover.style.top = `${top}px`;
    switchPopover.style.setProperty('--pos-switch-arrow', `${anchor.top + anchor.height / 2 - top - 4}px`);
  } else {
    const left = Math.max(8, Math.min(anchor.right - width, innerWidth - width - 8));
    const above = anchor.bottom + height + 8 >= innerHeight;
    const top = above ? Math.max(8, anchor.top - height - 6) : anchor.bottom + 6;
    switchPopover.style.left = `${left}px`;
    switchPopover.style.top = `${top}px`;
    switchPopover.style.setProperty('--pos-switch-arrow', `${anchor.left + anchor.width / 2 - left - 4}px`);
    switchPopover.toggleAttribute('data-above', above);
  }
  switchPopover.querySelector('[data-switch-cancel]').focus({ preventScroll: true });
}

switchPopover.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || !pendingSwitch) return;
  const { control, apply, enabled } = pendingSwitch;
  switchPopover.hidePopover();
  control.focus({ preventScroll: true });
  if (button.hasAttribute('data-switch-confirm')) apply(enabled);
});
switchPopover.addEventListener('beforetoggle', event => {
  if (event.newState === 'closed') pendingSwitch = null;
});
window.addEventListener('scroll', () => {
  if (switchPopover.matches(':popover-open')) switchPopover.hidePopover();
}, true);

      reportError('');
      imageSetting.render();
      showToast(image ? title + '已保存' : '已恢复默认图片');
    },
    {
      title: title + '设置',
      defaultName: '默认图片',
      configuredName: '自定义图片',

      spec: `建议 ${row.dataset.materialSize}，支持 PNG、JPG，最大 2 MB。`,

settingsPage.addEventListener('click', event => {
  const row = event.target.closest('.pos-setting-field, .pos-app-card');
  if (!row || event.defaultPrevented || event.target.closest('button, input, select, textarea, a')) return;

  const actions = row.querySelectorAll('.pos-switch, .pos-select-current > button');
  const action = Array.from(actions).find(button => !button.disabled && button.getClientRects().length);
  if (action) {
    event.preventDefault();
    action.click();
    return;
  }

  const select = row.querySelector('.pos-select-editor select');
  if (!select || select.disabled || !select.getClientRects().length) return;
  event.preventDefault();
  select.focus();
  try {
    select.showPicker?.();
  } catch {
    // The focused select remains usable if the browser does not open its picker.
  }
});

const settingTabList = root.querySelector('.crm-settings-nav [role="tablist"]');
if (settingTabList) {
  const settingTabs = Array.from(settingTabList.querySelectorAll('[role="tab"]'));
  const narrowSettingTabs = matchMedia('(max-width:640px)');
  function updateSettingTabOrientation() {
    settingTabList.setAttribute('aria-orientation', narrowSettingTabs.matches ? 'horizontal' : 'vertical');
  }
  updateSettingTabOrientation();
  narrowSettingTabs.addEventListener('change', updateSettingTabOrientation);
  function selectSettingCategory(selectedTab) {
    for (const tab of settingTabs) {
      const selected = tab === selectedTab;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
      findById(tab.getAttribute('aria-controls')).hidden = !selected;
    }
  }
  settingTabs.forEach((tab, index) => {
    tab.addEventListener('click', () => selectSettingCategory(tab));
    tab.addEventListener('keydown', event => {
      const previousKey = narrowSettingTabs.matches ? 'ArrowLeft' : 'ArrowUp';
      const nextKey = narrowSettingTabs.matches ? 'ArrowRight' : 'ArrowDown';
      const target = {
        [previousKey]: settingTabs[(index + settingTabs.length - 1) % settingTabs.length],
        [nextKey]: settingTabs[(index + 1) % settingTabs.length],
        Home: settingTabs[0],
        End: settingTabs.at(-1),
      }[event.key];
      if (!target) return;
      event.preventDefault();
      selectSettingCategory(target);
      target.focus();
    });
  });
}

root.addEventListener('crm-meta-pos-leave',()=>{
  if(body.classList.contains('dialog-open'))closeDialog();
  if (switchPopover.matches(':popover-open')) switchPopover.hidePopover();
  hideFloatingTooltip();
  if (settingTabList) renderAppWorkMode();
});

function receiptLogoPreviewHtml(src) {
  return `
    <div class="pos-receipt-preview-paper">
      <img class="pos-receipt-preview-sample" src="${receiptPreviewSrc}" alt="示例小票" width="720" height="1228">
      <div class="pos-receipt-preview-logo">
        <img src="${escapeHtml(src)}" alt="品牌 Logo">
      </div>
    </div>`;
}

function initializeExtraPosSettings(section) {
  const key = `crm-meta-pos-settings:${brand.customerNo}:${brand.no}:${section.dataset.posSetting}`;
  const fields = Array.from(section.querySelectorAll('select[name],button[role="switch"][name]'));
  const logoSection = section.querySelector('[data-receipt-logo]');
  const drafts = new Map();
  let loadedValue;
  let saved;

  const logoEditor = logoSection ? initializePosImageSetting(
    logoSection,
    () => saved.logo,
    (logo, reportError, onSaved) => save({ ...saved, logo }, onSaved, logoSection, reportError),
    {
      title: '小票 Logo 设置',
      configuredName: '品牌 Logo',
      help: '如需使用品牌 Logo，请上传图片。',
      spec: '图片要求待定',
      deleteMessage: '删除后将恢复打印收钱吧标准 Logo，确认删除？',
      previewTitle: '小票预览',
      showDefaultPreview: false,
      renderPreview: receiptLogoPreviewHtml,
    },
  ) : null;

  const settingEditors = fields.filter(field => field.hasAttribute('data-setting-edit')).map(field => {
    const group = field.closest('.crm-setting-section');
    const title = field.labels[0].textContent;
    const current = document.createElement('div');
    current.className = 'pos-select-current';
    current.innerHTML = '<span data-setting-value></span><button class="crm-inline-link" type="button">修改</button>';
    const editButton = current.querySelector('button');
    editButton.setAttribute('aria-label', '修改' + title);
    const value = current.querySelector('span');
    const editor = document.createElement('div');
    editor.className = 'pos-select-editor';
    editor.hidden = true;
    editor.innerHTML = '<button class="btn" type="button">取消</button><button class="btn primary" type="button">保存</button>';
    const [cancelButton, saveButton] = editor.querySelectorAll('button');
    field.before(current, editor);
    editor.prepend(field);

    editButton.addEventListener('click', () => {
      drafts.set(field.name, saved.values[field.name]);
      showError(group);
      render();
      field.focus();
    });
    cancelButton.addEventListener('click', () => {
      drafts.delete(field.name);
      showError(group);
      render();
      editButton.focus();
    });
    saveButton.addEventListener('click', () => {
      const values = { ...saved.values, [field.name]: drafts.get(field.name) };
      save({ ...saved, values }, () => drafts.delete(field.name), group);
      if (!drafts.has(field.name)) editButton.focus();
    });
    return { field, current, editor, value, saveButton };
  });

  function readSaved() {
    loadedValue = null;
    let stored;
    try {
      loadedValue = localStorage.getItem(key);
      stored = JSON.parse(loadedValue);
    } catch {
      // Use the example configuration if stored settings cannot be read.
    }
    const values = Object.fromEntries(fields.map(field => {
      const storedValue = stored?.values?.[field.name];
      if (field.matches('[role="switch"]')) {
        const valid = [field.dataset.on, field.dataset.off].includes(storedValue);
        return [field.name, valid ? storedValue : field.dataset.default];
      }
      const options = Array.from(field.options);
      const initial = options.find(option => option.defaultSelected) || options[0];
      return [field.name, options.some(option => option.value === storedValue) ? storedValue : initial.value];
    }));
    const storedLogo = stored?.logo;
    const logo = logoEditor && storedLogo?.source === 'upload' && storedLogo.src ? storedLogo : null;
    saved = { values, logo };
  }

  function showError(group, message = '') {
    const error = group.querySelector('[data-pos-error]');
    error.textContent = message;
    error.hidden = !message;
  }

  function render() {
    const values = { ...saved.values, ...Object.fromEntries(drafts) };
    for (const row of section.querySelectorAll('[data-pos-requires]')) {
      const [name, value] = row.dataset.posRequires.split('=');
      row.hidden = values[name] !== value;
    }
    for (const field of fields) {
      if (field.matches('[role="switch"]')) {
        field.setAttribute('aria-checked', String(values[field.name] === field.dataset.on));
      } else {
        field.value = values[field.name];
      }
    }
    for (const { field, current, editor, value, saveButton } of settingEditors) {
      const editing = drafts.has(field.name);
      current.hidden = editing;
      editor.hidden = !editing;
      value.textContent = field.selectedOptions[0]?.textContent || '';
      saveButton.disabled = field.value === saved.values[field.name];
    }
    logoEditor?.render();
  }

  function save(next, onSaved, group = section, reportError = message => showError(group, message)) {
    try {
      if (localStorage.getItem(key) !== loadedValue) {
        drafts.clear();
        readSaved();
        logoEditor?.reset();
        render();
        reportError('设置已更新，请查看当前值后重试。');
        return;
      }
      const serialized = JSON.stringify(next);
      localStorage.setItem(key, serialized);
      loadedValue = serialized;
    } catch {
      render();
      reportError('保存失败，请检查浏览器存储空间后重试。');
      return;
    }
    saved = next;
    onSaved?.();
    reportError('');
    render();
    showToast((group.dataset.settingLabel || group.querySelector('h3').textContent) + '已保存');
  }

  readSaved();
  render();
  for (const field of fields) {
    if (field.matches('[role="switch"]')) {
      field.addEventListener('click', () => confirmPosSwitch(field, next => {
        const value = next ? field.dataset.on : field.dataset.off;
        save({ ...saved, values: { ...saved.values, [field.name]: value } });
      }));
      continue;
    }
    field.addEventListener('change', () => {
      if (!drafts.has(field.name)) return;
      drafts.set(field.name, field.value);
      showError(field.closest('.crm-setting-section'));
      render();
    });
  }

  root.addEventListener('crm-meta-pos-leave', () => {
    drafts.clear();
    readSaved();
    logoEditor?.reset();
    showError(section);
    render();
  });
}

root.querySelectorAll('[data-pos-setting]').forEach(initializeExtraPosSettings);

  findById('closeDialog').addEventListener('click', closeDialog);
  root.addEventListener('click', hideFloatingTooltip);
}
